name: Deploy Node Application for Neokred

on:
  push:
    branches:
      - neokred-node

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Login to Docker
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} 
      - name: Build Docker image
        run: docker build -t prathapyara/neokred-server . 
      - name: Publish Docker image
        run: docker push prathapyara/neokred-server:latest
      - name: Run Docker container
        run: docker run -d -p 4000:5000 prathapyara/neokred-server:latest
